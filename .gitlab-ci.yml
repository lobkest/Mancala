# Use a Maven image with JDK 21 / latest JDK for building
image: maven:3.9-eclipse-temurin-21

# Cache dependencies to speed up pipeline execution across runs
cache:
  paths:
    - .m2/repository

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

stages:
  - build
  - test

# Stage 1: Compile the project
build:
  stage: build
  script:
    - mvn clean compile

# Stage 2: Run all JUnit tests
test:
  stage: test
  script:
    - mvn test
  artifacts:
    when: always
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml